<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Synth Remote — app icon</title>
  <desc id="description">Synth app icon family. Flat near-black plate, transparent surround. The Synth Term window frame and &gt;_ prompt with a flat Darcula blue tint (#6897BB), so Synth Remote reads as Synth Term's companion and stays distinct from it.</desc>
