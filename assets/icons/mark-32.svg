  <title id="title">Synth Remote Control — 32 px master</title>
  <desc id="description">Synth app icon family. Flat near-black plate, silver mark, transparent surround. The mark is a handheld remote with a round pad and two keys, sending a signal. Simplified for 24-32 px.</desc>
