<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Synth Remote Control — 16 px master</title>
  <desc id="description">Synth app icon family. Flat near-black plate, silver mark, transparent surround. The mark is a handheld remote with a round pad and two keys, sending a signal. Simplified for 16 px.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0.65" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.45" stop-color="#C3CFDC"/>
      <stop offset="1" stop-color="#A9B7C6"/>
    </linearGradient>
  </defs>
  <g id="foundation">
    <rect x="64" y="64" width="896" height="896" rx="184" fill="#101014"/>
  </g>
  <g id="glyph" fill="#A9B7C6" fill-rule="evenodd">
    <path d="M 384,384 H 640 A 64 64 0 0 1 704 448 V 768 A 64 64 0 0 1 640 832 H 384 A 64 64 0 0 1 320 768 V 448 A 64 64 0 0 1 384 384 Z
             M 448,512 H 576 V 640 H 448 Z"/>
    <path d="M 320,192 H 704 V 320 H 320 Z"/>
  </g>
