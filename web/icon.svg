<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Synth Remote — dashboard icon</title>
  <desc id="description">Synth app icon family. Flat near-black plate, transparent surround. The Synth Term window frame and &gt;_ prompt in the dashboard's blue accent, so the remote dashboard reads as Synth Term's companion. Simplified for 16-32 px favicons.</desc>
  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="0.65" y2="1">
      <stop stop-color="#D6E2FF"/>
      <stop offset="0.45" stop-color="#8FB0FF"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
  </defs>
  <g id="foundation">
    <rect x="64" y="64" width="896" height="896" rx="184" fill="#101014"/>
  </g>
  <g id="glyph" fill="url(#signal)" fill-rule="evenodd">
    <path d="M 272,240 H 752 A 80 80 0 0 1 832,320 V 704 A 80 80 0 0 1 752,784 H 272 A 80 80 0 0 1 192,704 V 320 A 80 80 0 0 1 272,240 Z M 304,320 H 720 A 32 32 0 0 1 752,352 V 672 A 32 32 0 0 1 720,704 H 304 A 32 32 0 0 1 272,672 V 352 A 32 32 0 0 1 304,320 Z"/>
    <path d="M 320,384 H 416 L 512,512 L 416,640 H 320 L 416,512 Z M 544,576 H 720 V 640 H 544 Z"/>
  </g>
</svg>
