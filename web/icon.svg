<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Synth Remote — 24/32 px master</title>
  <desc id="description">Synth app icon family. Flat near-black plate, transparent surround. The Synth Term window frame and &gt;_ prompt with a flat Darcula blue tint (#6897BB), so Synth Remote reads as Synth Term's companion and stays distinct from it. Simplified for 24-32 px.</desc>
  <g id="foundation">
    <rect x="64" y="64" width="896" height="896" rx="184" fill="#101014"/>
  </g>
  <g id="glyph" fill="#6897BB" fill-rule="evenodd">
